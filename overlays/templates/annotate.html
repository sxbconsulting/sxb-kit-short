<!doctype html>
<!-- Capture annotée à la main : cercles, encadrés, soulignés, flèches qui se dessinent, avec étiquette manuscrite.
     Thèmes : dark (DA-SXB) / cream (kit avatar). Rendu : node overlays/render-overlay.mjs <params.json> (voir overlays/README.md). -->
<html lang="fr" data-composition-variables='[
 {
  "id": "kicker",
  "type": "string",
  "label": "Sur-titre",
  "default": "REGARDE ICI"
 },
 {
  "id": "src",
  "type": "string",
  "label": "Capture",
  "default": ""
 },
 {
  "id": "img_h",
  "type": "number",
  "label": "Hauteur de l’image (px)",
  "default": 520
 },
 {
  "id": "marks",
  "type": "string",
  "label": "Annotations (JSON : type circle|box|underline|arrow, x, y, w, h en 0-1, at, label)",
  "default": "[{\"type\":\"circle\",\"x\":0.55,\"y\":0.3,\"w\":0.35,\"h\":0.2,\"at\":0.9,\"label\":\"le prix barré\"},{\"type\":\"underline\",\"x\":0.08,\"y\":0.62,\"w\":0.5,\"h\":0.08,\"at\":1.9,\"label\":\"\"}]"
 },
 {
  "id": "source",
  "type": "string",
  "label": "Source",
  "default": "capture · date"
 },
 {
  "id": "theme",
  "type": "enum",
  "label": "Thème",
  "default": "dark",
  "options": [
   {
    "value": "dark",
    "label": "DA-SXB noir / pêche"
   },
   {
    "value": "cream",
    "label": "Avatar crème / rouge"
   }
  ]
 },
 {
  "id": "top",
  "type": "number",
  "label": "Position haute (px)",
  "default": 280
 },
 {
  "id": "duration",
  "type": "number",
  "label": "Durée (s)",
  "default": 5
 },
 {
  "id": "words",
  "type": "string",
  "label": "Mots (JSON, rempli par render-overlay)",
  "default": "[]"
 },
 {
  "id": "highlight",
  "type": "string",
  "label": "Instants de pulsation (JSON)",
  "default": "[]"
 }
]'>
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="_sxb.css" />
<script src="../../assets/gsap.min.js"></script>
<style>
.wrap { position: relative; margin-top: 22px; border-radius: 14px; overflow: hidden; width: 804px; }
.wrap img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.wrap svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.lbl { position: absolute; font-family: var(--hand); font-weight: 700; font-size: 58px; color: var(--ac); white-space: nowrap; transform: rotate(-6deg);
       text-shadow: 0 2px 0 rgba(0,0,0,.35); }
html[data-theme="cream"] .lbl { text-shadow: 0 0 6px #fff, 0 0 2px #fff; }
</style>
</head>
<body>
  <div id="root" data-composition-id="annotate" data-start="0" data-width="1080" data-height="1920">
<div class="card" id="card">
      <div class="kicker" id="kicker"></div>
      <div class="wrap" id="wrap"><img id="shot" alt="" /><svg id="ink"></svg></div>
      <div class="source" id="source"></div>
    </div>
  </div>
  <script src="_sxb.js"></script>
  <script>
const S = SXB, v = S.v, $ = S.$;
    $("#kicker").textContent = v.kicker; $("#source").textContent = v.source;
    const img = $("#shot"); $("#wrap").style.height = v.img_h + "px"; if (v.src) img.src = v.src;
    S.enter();
    {                                                    // boîte fixe 804 × img_h : tout se calcule tout de suite
      const W = 804, H = Number(v.img_h), svg = $("#ink");
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      S.J(v.marks, []).forEach((m, k) => {
        const x = m.x * W, y = m.y * H, w = m.w * W, h = m.h * H;
        let d;
        if (m.type === "box") d = S.wobblyLine(x, y, x + w, y, k + 1, 3) + S.wobblyLine(x + w, y, x + w, y + h, k + 2, 3).replace("M", " L") + S.wobblyLine(x + w, y + h, x, y + h, k + 3, 3).replace("M", " L") + S.wobblyLine(x, y + h, x, y - 4, k + 4, 3).replace("M", " L");
        else if (m.type === "underline") d = S.wobblyLine(x, y + h, x + w, y + h, k + 7, 5);
        else if (m.type === "arrow") d = `M${x + w} ${y + h} Q${x + w * 0.2} ${y + h} ${x} ${y} M${x} ${y} L${x + 34} ${y + 6} M${x} ${y} L${x + 8} ${y + 34}`;
        else d = S.wobblyEllipse(x + w / 2, y + h / 2, w / 2 + 14, h / 2 + 12, k + 3);
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "var(--ac)");
        p.setAttribute("stroke-width", "9"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
        svg.appendChild(p); S.draw(p, m.at, m.type === "underline" ? 0.3 : 0.5);
        if (m.label) {
          const l = S.el("div", "lbl", m.label, $("#wrap"));
          const lw = m.label.length * 27 + 20;                                  // largeur estimée de l’étiquette manuscrite
          l.style.left = Math.max(8, Math.min(W - lw, x + w * 0.5 - lw / 2)) + "px"; l.style.top = Math.max(4, y - 78) + "px";
          S.rise(l, m.at + 0.35, 14);
        }
      });
    }
    S.finish("annotate");
  </script>
</body>
</html>
