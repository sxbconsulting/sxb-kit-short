<!doctype html>
<!-- Carte chiffre : sur-titre, chiffre qui compte, pastille, légende, source.
     Thèmes : dark (DA-SXB) / cream (kit avatar). Rendu : node overlays/render-overlay.mjs <params.json> (voir overlays/README.md). -->
<html lang="fr" data-composition-variables='[
 {
  "id": "kicker",
  "type": "string",
  "label": "Sur-titre",
  "default": "PANIER MOYEN EN FRANCE"
 },
 {
  "id": "value",
  "type": "number",
  "label": "Chiffre",
  "default": 62
 },
 {
  "id": "decimals",
  "type": "number",
  "label": "Décimales",
  "default": 0
 },
 {
  "id": "prefix",
  "type": "string",
  "label": "Préfixe",
  "default": ""
 },
 {
  "id": "suffix",
  "type": "string",
  "label": "Suffixe",
  "default": " €"
 },
 {
  "id": "value_at",
  "type": "number",
  "label": "Compteur à (s)",
  "default": 0.5
 },
 {
  "id": "badge",
  "type": "string",
  "label": "Pastille (vide = aucune)",
  "default": "−3 %"
 },
 {
  "id": "badge_at",
  "type": "number",
  "label": "Pastille à (s)",
  "default": 1.6
 },
 {
  "id": "label",
  "type": "string",
  "label": "Légende",
  "default": "en 2025"
 },
 {
  "id": "source",
  "type": "string",
  "label": "Source",
  "default": "Fevad, bilan e-commerce 2025"
 },
 {
  "id": "theme",
  "type": "enum",
  "label": "Thème",
  "default": "dark",
  "options": [
   {
    "value": "dark",
    "label": "DA-SXB noir / pêche"
   },
   {
    "value": "cream",
    "label": "Avatar crème / rouge"
   }
  ]
 },
 {
  "id": "top",
  "type": "number",
  "label": "Position haute (px)",
  "default": 280
 },
 {
  "id": "duration",
  "type": "number",
  "label": "Durée (s)",
  "default": 5
 },
 {
  "id": "words",
  "type": "string",
  "label": "Mots (JSON, rempli par render-overlay)",
  "default": "[]"
 },
 {
  "id": "highlight",
  "type": "string",
  "label": "Instants de pulsation (JSON)",
  "default": "[]"
 }
]'>
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="_sxb.css" />
<script src="../../assets/gsap.min.js"></script>
<style>
.row { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; }
.value { font-weight: 900; font-size: 190px; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--ac); text-shadow: var(--glow); }
html[data-theme="cream"] .value { color: var(--tx); }
.badge { font-size: 64px; }
.label { margin-top: 12px; font-weight: 700; font-size: 40px; }
</style>
</head>
<body>
  <div id="root" data-composition-id="stat-card" data-start="0" data-width="1080" data-height="1920">
<div class="card" id="card">
      <div class="kicker" id="kicker"></div>
      <div class="row"><div class="value" id="value"></div><div class="pill badge" id="badge"></div></div>
      <div class="label" id="label"></div>
      <div class="source" id="source"></div>
    </div>
  </div>
  <script src="_sxb.js"></script>
  <script>
const S = SXB, v = S.v, $ = S.$;
    $("#kicker").textContent = v.kicker; $("#label").textContent = v.label; $("#source").textContent = v.source;
    const o = { n: 0 }, val = $("#value"); val.textContent = S.fmt(0, v.decimals, v.prefix, v.suffix);
    S.enter();
    S.tl.to(o, { n: v.value, duration: 0.8, ease: "power2.out", onUpdate: () => { val.textContent = S.fmt(o.n, v.decimals, v.prefix, v.suffix); } }, v.value_at);
    if (v.badge) { $("#badge").textContent = v.badge; S.pop("#badge", v.badge_at, { rotation: -10 }); } else $("#badge").style.display = "none";
    S.finish("stat-card");
  </script>
</body>
</html>
